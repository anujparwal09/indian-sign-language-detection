[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-sign-language-detection"
version = "1.0.0"
description = "Real-time Indian Sign Language Detection using Deep Learning and Streamlit"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.28.0",
    "opencv-python-headless>=4.8.0",
    "cvzone>=1.5.6",
    "numpy>=1.23.0,<2.0",
    "tensorflow>=2.13.0,<2.17",
    "Pillow>=10.0.0",
    "protobuf>=3.20.0",
    "streamlit-webrtc>=0.47.0",
    "aiortc>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
]
